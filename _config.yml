title: Admin Husic
tagline: Dynamic Connectivity Lab
description: >-
  Research and teaching site of Admin Husic, Associate Professor of Civil and
  Environmental Engineering at Virginia Tech. Hydrologic connectivity, sediment
  and nutrient transport, and machine learning for water resources.
author: Admin Husic

email: husic@vt.edu
orcid: "0000-0002-4225-2252"
vt_profile: "https://www.webapps.cee.vt.edu/index.php?category=people&pagetype=bio&do=getprofile&user=husic.html"
linkedin: "https://www.linkedin.com/in/admin-husic/"
scholar: "https://scholar.google.com/citations?user=DwaJAr0AAAAJ"

# Used by jekyll-seo-tag for canonical URLs, Open Graph/Twitter card tags, and
# structured data -- these need a real absolute URL to generate correctly.
#
# This is the custom domain (registered at Porkbun), NOT the repo's
# adminhusic.github.io address. The repo must stay named adminhusic.github.io to
# remain a GitHub user page; the custom domain is layered on via the CNAME file
# at the repo root plus apex A/AAAA records pointing at GitHub Pages. GitHub
# 301-redirects the old adminhusic.github.io URLs here, so previously shared
# links keep working.
#
# baseurl stays blank: served at the domain root, not under a path prefix.
url: "https://adminhusic.com"
baseurl: ""

# The github-pages gem defaults to `theme: jekyll-theme-primer` when this key is
# absent, and that theme's own assets/css/style.css silently overwrites this
# site's custom stylesheet at build time. Keep this explicit and null.
theme: null

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - PRODUCT.md
  - DESIGN.md
  - .impeccable

nav:
  - title: Home
    path: /
  - title: People
    path: /people/
  - title: Research
    path: /research/
  - title: Publications
    path: /publications/
  - title: Teaching
    path: /teaching/
  - title: Join Us
    path: /join-us/
