name: Sync publications from ORCID

on:
  schedule:
    # Every Monday at 13:00 UTC. Change the cron expression to adjust frequency;
    # this only checks for new DOIs, it doesn't rebuild/deploy anything on its own.
    - cron: "0 13 * * 1"
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        run: npm install

      - name: Run ORCID sync
        run: npm run sync-orcid

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read summary
        id: summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "body<<EOF"
            cat .github/scripts/sync-orcid-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add publication(s) found on ORCID"
          title: "New publication(s) found on ORCID"
          body: ${{ steps.summary.outputs.body }}
          branch: orcid-sync
          delete-branch: true
          add-paths: _data/publications.yml
