name: Sync publications from ORCID

# Two checks, one PR: new works on ORCID that aren't on the site yet, and entries
# already listed as "In Press" that Crossref has since given a volume/issue/pages.

on:
  schedule:
    # Every Monday at 13:00 UTC. Change the cron expression to adjust frequency;
    # this only opens a PR against _data/publications.yml, it doesn't rebuild or
    # deploy anything on its own.
    - cron: "0 13 * * 1"
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # If last week's PR hasn't been merged or closed yet, stop here. Otherwise the
      # "Open pull request" step below would force-reset the orcid-sync branch to a
      # freshly generated file and silently wipe any corrections made in that PR.
      # Nothing is lost by waiting: anything new is still on ORCID next week.
      - name: Skip if a sync PR is still open
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head orcid-sync --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            msg="Skipped: a sync pull request (branch orcid-sync) is still open. Merge or close it and the next run will check again."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.pending.outputs.open != 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.pending.outputs.open != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        if: steps.pending.outputs.open != 'true'
        run: npm install

      - name: Run ORCID sync
        if: steps.pending.outputs.open != 'true'
        run: npm run sync-orcid

      - name: Check for changes
        if: steps.pending.outputs.open != 'true'
        id: diff
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read summary
        id: summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "body<<EOF"
            cat .github/scripts/sync-orcid-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "title=$(cat .github/scripts/sync-orcid-title.txt)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: ${{ steps.summary.outputs.title }}
          title: ${{ steps.summary.outputs.title }}
          body: ${{ steps.summary.outputs.body }}
          branch: orcid-sync
          delete-branch: true
          add-paths: _data/publications.yml
