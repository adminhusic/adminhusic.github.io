# Peer-reviewed journal articles for Admin Husic
# Reverse-chronological. PUBLISHED WORK ONLY -- in-review / in-revision
# manuscripts are deliberately not listed here. They do not appear on ORCID as
# journal articles (so the sync never adds them), the site never rendered them
# anyway, and listing unpublished work claims a result before it has cleared peer
# review. A paper enters this file once it is accepted and has a real DOI.
# "In Press" entries are legitimate published work -- online and citable by DOI,
# they simply have no volume/page numbers yet.
#
# NOTE ON ENCODING: this file is UTF-8 and contains non-ASCII author names
# (Brandao, Marin, Gomez, Echavarria are all accented in the real text) plus
# en-dashes and curly quotes. Edit it with a UTF-8-aware tool. In particular, do
# NOT round-trip it through Windows PowerShell's `Get-Content` / `Set-Content`
# without an explicit `-Encoding utf8`: the default reads UTF-8 bytes as ANSI and
# silently mangles every accented name in the file.
#
# Schema per entry:
#   year:      integer, publication (or expected) year
#   status:    always "published". The field is kept because the Publications page
#              and the homepage count both filter on it, so it still guards against
#              an unpublished entry slipping in.
#   lead:      "lab" if the work was led or directed from this lab, else "external".
#              This is a judgment about who drove the work -- NOT a mechanical check
#              of whether the first author is Husic or an advisee. Being an advisee
#              and leading a paper from this lab are different things, and the two
#              can come apart in both directions. Two real entries below look like
#              errors under the naive rule but are correct as written -- do NOT
#              "fix" them:
#                * Michalek et al. 2023 (Nature Communications) is "external".
#                  Michalek is a former MS advisee, so his name is underlined, but
#                  that paper came out of his later PhD lab, not this one.
#                * Layzell et al. 2026 (ESPL) is "lab". Layzell is an independent
#                  scientist and the first author, but Husic is corresponding
#                  author and directed the work.
#              Drives the All / Lab-Led filter on the Publications page, so a wrong
#              value changes a number shown publicly. The ORCID sync script cannot
#              infer this field (Crossref does not reliably expose corresponding
#              author, and never exposes who directed the work) -- always verify
#              `lead` by hand on any auto-synced entry before merging its PR.
#   authors:   full author list as written in the CV, up to the year.
#              <u> wraps student/postdoc advisee names (per the CV's own
#              underline convention); <strong> wraps Husic, A.
#   title:     article title only, no trailing period
#   journal:   journal name only (null if not yet assigned / not stated)
#   citation:  everything after the journal name (volume/issue/pages/article
#              number, or "In Press" for accepted work not yet paginated)
#   doi:       DOI URL (e.g. "https://doi.org/10.xxxx/..."), or null if not
#              yet filled in — none are populated automatically; add real
#              DOIs here to make the DOI button appear per entry.
#   note:      optional trailing annotation (e.g. an editor's-pick note)
#
# No `pdf` field: publication PDFs are intentionally not self-hosted (not all
# articles are open access, and the author does not hold blanket redistribution
# rights on the publisher's typeset PDF for closed-access work). The DOI link
# is the only download path, for every entry, open-access or not.

